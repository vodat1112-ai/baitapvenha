<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phiếu bài tập cuối tuần</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--tx:#222;--mut:#666;--ok:#1a9d4a;--bad:#d93a3a;--line:#ccc;--pri:#e8590c;--c1:#e8467c;--c2:#2d9cdb;--c3:#27ae60;--c4:#f2a31b;--c5:#8e55d6;--in:#fff8e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1c1a17;--card:#2a2723;--tx:#f1ede6;--mut:#aaa;--line:#555;--in:#2d3346;--ok:#69db7c;--bad:#ff8787;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.7 "Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.top{display:flex;justify-content:flex-end}
h1{text-align:center;margin:6px 0 0;color:var(--c2);font-size:1.7rem}
.sub{text-align:center;color:var(--c1);font-weight:700;margin-bottom:10px}
.who{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.who label{flex:1;min-width:200px}
.who input{width:65%;border:0;border-bottom:2px dotted var(--mut);background:none;color:var(--tx);font:inherit}
h2{margin:22px 0 4px;padding:6px 14px;border-radius:12px;background:var(--c2);color:#fff;font-size:1.2rem}
.box,.card{background:var(--card);border:2.5px dashed var(--c,var(--line));border-radius:16px;padding:12px 16px;margin:12px 0}
.card h2{background:none;color:var(--pri);padding:0;margin:4px 0 8px}
.t{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.t b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px}.grid.c1{grid-template-columns:1fr}
.it{padding:2px 0}
input.i,textarea{border:0;border-bottom:2px dotted var(--mut);background:none;color:var(--tx);font:inherit;text-align:center;border-radius:4px;padding:0 2px}
input.i:focus,textarea:focus{outline:2px solid var(--c2);background:rgba(45,156,219,.08)}
textarea{width:100%;text-align:left;border:2px dotted var(--line);padding:6px 8px;resize:vertical}
.ok{border-color:var(--ok)!important;background:rgba(26,157,74,.15)!important;color:var(--ok)}
.bad{border-color:var(--bad)!important;background:rgba(217,58,58,.14)!important}
.n0{border:2px solid var(--c4);border-radius:8px;padding:1px 12px;font-weight:700}
.hint{font-size:.85rem;color:var(--mut)}
.mw{position:relative;margin:8px 0;user-select:none;-webkit-user-select:none}
.mw svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.mc{display:flex;justify-content:space-between;gap:30%}.mcol{flex:1;display:flex;flex-direction:column;gap:12px}
.mi{position:relative;text-align:center;padding:8px;border:2.5px solid var(--line);border-radius:10px;background:var(--card);font-weight:700;cursor:grab;touch-action:none}
.mi::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--c2)}
.mi.L::after{right:-9px}.mi.R::after{left:-9px}
button{font:inherit;font-weight:700;border:0;border-radius:24px;padding:10px 18px;color:#fff;cursor:pointer;background:var(--pri)}
button:disabled{opacity:.6}
button.s{background:var(--mut);padding:6px 12px;font-size:.9rem}
.bar{position:sticky;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px;background:var(--bg);flex-wrap:wrap}
.go{background:var(--c3)}.rs{background:var(--c4)}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;text-align:center;font-weight:700}
.msg.ok{background:rgba(26,157,74,.15);color:var(--ok)}.msg.er{background:rgba(217,58,58,.14);color:var(--bad)}
.card input.w,.card select,dialog input{font:inherit;color:var(--tx);background:var(--in);border:2px solid var(--line);border-radius:10px;padding:5px 8px}
.card input.w{width:100%}
.card textarea{font:13px/1.4 monospace;height:200px;text-align:left;background:var(--in)}
dialog{background:var(--card);color:var(--tx);border:2px dashed var(--line);border-radius:16px}
dialog .row{margin:8px 0;display:flex;gap:6px}
details{border-top:1px solid var(--line);padding:6px 0}summary{cursor:pointer}
.c{color:var(--ok)}.x{color:var(--bad)}
</style></head><body><div class="wrap">
<div class="top"><button class="s" id="lg">🔐 Đăng nhập giáo viên</button></div>

<div id="adm" hidden class="card"><h2>👩‍🏫 Đăng phiếu bài tập mới</h2>
<p class="hint">Chọn file đề (.json) hoặc dán nội dung JSON vào ô dưới. Tạo file JSON bằng cách gửi PDF cho Claude.</p>
<input type="file" id="af" accept=".json,.txt,application/json">
<textarea id="as" spellcheck="false" placeholder='{"title":"PHIẾU BÀI TẬP TUẦN 8","sections":[ ... ]}'></textarea>
<input id="at" class="w" placeholder="Tên phiếu (bỏ trống = lấy title trong JSON)">
<p><button id="ap">Đăng cho học sinh</button></p><div id="am" class="hint"></div>
<h2>📥 Bài đã nộp</h2><select id="af2"></select><div id="al" class="hint"></div></div>

<div id="none" class="card" hidden></div>
<div id="work" hidden>
<h1 id="ttl"></h1><div class="sub" id="sub"></div>
<div class="who"><label>Họ và tên: <input id="name" autocomplete="off"></label><label>Lớp: <input id="cls" style="width:40%" autocomplete="off"></label></div>
<div id="exam"></div><div id="msg"></div>
<div class="bar"><button class="go" id="send">✉️ Nộp bài cho cô/thầy</button><button class="rs" id="rst">↺ Làm lại</button></div>
</div>

<dialog id="dg"><h2>Đăng nhập giáo viên</h2>
<div class="row"><input id="u" placeholder="Tên đăng nhập" autocomplete="username"></div>
<div class="row"><input id="p" type="password" placeholder="Mật khẩu" autocomplete="current-password"></div>
<div class="row"><button id="go2">Đăng nhập</button><button class="s" id="cl">Đóng</button></div><div id="le" class="x"></div></dialog>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ===== CẤU HÌNH: giữ nguyên như bản cũ =====
const SB_URL="https://xdnxsysxsigqauusopnm.supabase.co",SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkbnhzeXN4c2lncWF1dXNvcG5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMzk4NzAsImV4cCI6MjEwOTgxNTg3MH0.PpV9xa-4LdrSFWAwJJM5EncscA85KKWsBw4xysNG_ZI";
// ===========================================
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const COL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm=s=>String(s??"").toLowerCase().replace(/\s+/g,"").replace(/[−–]/g,"-");
let cur=null,AS=[],matches=[],sent=false;

// ---------- Dựng đề từ JSON ----------
function inline(t){return t.replace(/\{([^}]*)\}/g,(m,a)=>{const w=Math.max(2.2,a.split("|")[0].length*.75+1.2);
 return `<input class="i" data-a="${esc(a)}" style="width:${w}em" autocomplete="off">`}).replace(/\n/g,"<br>")}
function build(ex){
 $("#ttl").textContent=ex.title||"";$("#sub").textContent=ex.subtitle||"";$("#msg").innerHTML="";
 let n=0,h="";matches=[];
 ex.sections.forEach((s,k)=>{
  if(s.heading){n=0;h+=`<h2>${s.heading}</h2>`;return}
  n++;h+=`<div class="box" style="--c:${COL[k%5]}"><div class="t"><b>${n}</b>${s.title||""}</div>${s.intro?`<p>${s.intro}</p>`:""}`;
  if(s.hint)h+=`<div class="hint">${s.hint}</div>`;
  if(s.type==="match")h+=`<div class="mw" data-k="${k}"><svg></svg><div class="mc"><div class="mcol">${s.left.map((x,i)=>`<div class="mi L" data-s="L" data-i="${i}">${x}</div>`).join("")}</div><div class="mcol">${s.right.map((x,i)=>`<div class="mi R" data-s="R" data-i="${i}">${x}</div>`).join("")}</div></div></div>`;
  else if(s.type==="free")h+=`<textarea rows="${s.rows||2}"></textarea>`;
  else h+=`<div class="grid ${s.cols===1?"c1":""}">${(s.items||[]).map(x=>`<div class="it">${inline(x)}</div>`).join("")}</div>`;
  h+="</div>"});
 $("#exam").innerHTML=h;
 $$(".mw").forEach(w=>initMatch(w,ex.sections[w.dataset.k]));
}
function initMatch(w,s){
 const svg=w.querySelector("svg"),L=[...w.querySelectorAll(".L")],R=[...w.querySelectorAll(".R")];
 const m={w,s,links:{},pairs:s.pairs||[],res:null,draw};let drag=null;matches.push(m);
 const pt=(el,side)=>{const r=el.getBoundingClientRect(),b=w.getBoundingClientRect();return{x:(side==="L"?r.right:r.left)-b.left,y:r.top+r.height/2-b.top}};
 const ln=(a,b,c)=>`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`;
 function draw(){let o="";for(const l in m.links){const c=m.res?(m.res[l]?"var(--ok)":"var(--bad)"):"var(--c2)";o+=ln(pt(L[l],"L"),pt(R[m.links[l]],"R"),c)}
  if(drag)o+=ln(drag.a,drag.b,"var(--c2)");svg.innerHTML=o}
 const rel=e=>{const b=w.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
 w.addEventListener("pointerdown",e=>{const it=e.target.closest(".mi");if(!it)return;e.preventDefault();w.setPointerCapture(e.pointerId);
  m.res=null;let side=it.dataset.s,i=+it.dataset.i;
  if(side==="L")delete m.links[i];
  else{const l=Object.keys(m.links).find(k=>m.links[k]===i);if(l!==undefined){delete m.links[l];side="L";i=+l}}
  drag={from:side,i,a:pt(side==="L"?L[i]:R[i],side),b:rel(e)};draw()});
 w.addEventListener("pointermove",e=>{if(!drag)return;drag.b=rel(e);draw()});
 w.addEventListener("pointerup",e=>{if(!drag)return;
  const t=document.elementFromPoint(e.clientX,e.clientY),it=t&&t.closest(".mi");
  if(it&&w.contains(it)&&it.dataset.s!==drag.from){
   const l=drag.from==="L"?drag.i:+it.dataset.i,r=drag.from==="R"?drag.i:+it.dataset.i;
   for(const k in m.links)if(m.links[k]===r)delete m.links[k];m.links[l]=r}
  drag=null;draw()});
 window.addEventListener("resize",draw);draw();
}

// ---------- Thu thập, chấm điểm, tô màu ----------
const plain=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent.trim()};
function collect(){const d=[];
 $$("#exam .box").forEach(b=>{const num=b.querySelector(".t b").textContent;
  b.querySelectorAll("input[data-a]").forEach(e=>{const ok=e.dataset.a.split("|").map(norm).includes(norm(e.value));
   e.classList.toggle("ok",ok);e.classList.toggle("bad",!ok);
   d.push({l:`Câu ${num}: ${e.closest(".it").textContent.trim().slice(0,50)}`,a:e.value.trim(),ok})});
  b.querySelectorAll("textarea").forEach(e=>d.push({l:`Câu ${num}: ${b.querySelector(".t").textContent.slice(1).trim().slice(0,50)}`,a:e.value.trim(),ok:null}));
  const m=matches.find(x=>x.w.closest(".box")===b);
  if(m){m.res={};m.pairs.forEach(([l,r])=>{const got=m.links[l],ok=got===r;m.res[l]=ok;
    d.push({l:`Câu ${num}: nối ${plain(m.s.left[l])}`,a:got===undefined?"":plain(m.s.right[got]),ok})});
   for(const l in m.links)if(m.res[l]===undefined)m.res[l]=false;m.draw()}});
 return d}

const show=(t,c)=>$("#msg").innerHTML=`<div class="msg ${c}">${t}</div>`;
$("#rst").onclick=()=>{$$("#exam input,#exam textarea").forEach(e=>{e.value="";e.classList.remove("ok","bad")});
 matches.forEach(m=>{m.links={};m.res=null;m.draw()});$("#msg").innerHTML=""};

$("#send").onclick=async()=>{
 const name=$("#name").value.trim(),cls=$("#cls").value.trim();
 if(!name||!cls){show("Em nhớ điền Họ và tên và Lớp trước khi nộp nhé!","er");$("#name").focus();return}
 if(sent&&!confirm("Em đã nộp rồi. Nộp lại lần nữa nhé?"))return;
 const d=collect(),blank=d.filter(x=>!x.a).length;
 if(blank&&!confirm(`Em còn ${blank} chỗ chưa làm. Vẫn nộp bài chứ?`))return;
 const g=d.filter(x=>x.ok!==null),got=g.filter(x=>x.ok).length,total=g.length,s10=total?Math.round(got/total*100)/10:0;
 const res=total?`🎯 Điểm của em: ${s10}/10 (${got}/${total} ý đúng). Các câu viết cô giáo sẽ chấm.`:"";
 const btn=$("#send");btn.disabled=true;btn.textContent="Đang nộp…";
 const {error}=await sb.from("submissions").insert({assignment_id:cur.id,name,cls,got,total,score10:s10,
  done:d.length-blank,count:d.length,labels:d.map(x=>x.l),answers:d.map(x=>x.a),detail:d});
 if(error)show(`Chưa gửi được bài. Em kiểm tra mạng rồi bấm Nộp bài lại nhé.<br>${res}`,"er");
 else{sent=true;show(`✅ Đã nộp bài, cảm ơn ${esc(name)}!<br>${res}`,"ok")}
 btn.disabled=false;btn.textContent="✉️ Nộp bài cho cô/thầy"};

// ---------- Học sinh: tải phiếu đang mở ----------
async function load(){
 const {data,error}=await sb.from("assignments").select("*").eq("active",true).order("created_at",{ascending:false}).limit(1);
 const n=$("#none");
 if(error){n.hidden=false;n.textContent="Không tải được phiếu. Em kiểm tra mạng rồi tải lại trang nhé.";return}
 cur=data&&data[0];
 if(!cur||!cur.exam){n.hidden=false;n.textContent="Chưa có phiếu bài tập nào. Em quay lại sau nhé!";return}
 n.hidden=true;$("#work").hidden=false;build(cur.exam)}

// ---------- Giáo viên ----------
$("#lg").onclick=async()=>{if(!$("#adm").hidden){await sb.auth.signOut();location.reload()}else $("#dg").showModal()};
$("#cl").onclick=()=>$("#dg").close();
$("#go2").onclick=async()=>{
 const {error}=await sb.auth.signInWithPassword({email:$("#u").value.trim().toLowerCase()+"@"+DOM,password:$("#p").value});
 if(error){$("#le").textContent="Sai tên đăng nhập hoặc mật khẩu";return}
 $("#p").value="";$("#dg").close();admin()};
async function admin(){$("#adm").hidden=false;$("#work").hidden=true;$("#none").hidden=true;$("#lg").textContent="Đăng xuất";loadList()}
$("#af").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>$("#as").value=r.result;r.readAsText(f)};

$("#ap").onclick=async()=>{const m=$("#am");let ex;
 try{ex=JSON.parse($("#as").value);if(!Array.isArray(ex.sections))throw 0}catch(e){m.textContent="File đề không đúng định dạng JSON (thiếu mục sections).";return}
 const title=$("#at").value.trim()||ex.title||"Phiếu mới";m.textContent="Đang đăng…";
 const {data,error}=await sb.from("assignments").insert({title,exam:ex,active:true}).select("id").single();
 if(error){m.textContent="Lỗi: "+error.message;return}
 const r=await sb.from("assignments").update({active:false}).eq("active",true).neq("id",data.id);
 m.textContent=r.error?"Đã đăng, nhưng chưa tắt được phiếu cũ: "+r.error.message:"✅ Đã đăng. Học sinh mở link là thấy phiếu mới.";
 $("#as").value="";loadList()};

async function loadList(){const {data}=await sb.from("assignments").select("id,title,active").order("created_at",{ascending:false});
 AS=data||[];$("#af2").innerHTML=AS.map(a=>`<option value="${a.id}">${esc(a.title)}${a.active?" (đang mở)":""}</option>`).join("");showSub()}
$("#af2").onchange=showSub;
async function showSub(){const L=$("#al"),id=$("#af2").value;if(!id){L.textContent="Chưa có phiếu.";return}
 const {data,error}=await sb.from("submissions").select("*").eq("assignment_id",id).order("created_at",{ascending:false}).limit(500);
 if(error){L.textContent="Lỗi tải bài nộp: "+error.message;return}
 const rows=data||[];
 L.innerHTML=`<p>Tổng: <b>${rows.length}</b> bài</p>`+rows.map(r=>{
  const d=Array.isArray(r.detail)?r.detail:(Array.isArray(r.answers)?r.answers.map((a,i)=>({l:(r.labels||[])[i],a,ok:null})):[]);
  return `<details><summary><b>${esc(r.name)}</b> · lớp ${esc(r.cls)} · <b>${r.score10}/10</b> · ${new Date(r.created_at).toLocaleString("vi-VN")}</summary>`+
  d.map(x=>`<div>${esc(x.l)}: <b>${esc(x.a)||"—"}</b>${x.ok===true?' <span class="c">✓</span>':x.ok===false?' <span class="x">✗</span>':""}</div>`).join("")+"</details>"}).join("")}

sb.auth.getSession().then(({data})=>data.session?admin():load());
</script></body></html>
